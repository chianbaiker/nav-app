<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>导航地址管理</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        background: #f2f2f7; color: #1c1c1e; padding-bottom: 40px;
    }
    .header {
        background: #fff; padding: 16px; position: sticky; top: 0; z-index: 10;
        border-bottom: 1px solid #e5e5ea;
    }
    .title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 12px; }
    .location-bar {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 13px; color: #666;
    }
    .location-text { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; }
    .location-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .location-dot.loading { background: #f0ad4e; animation: blink 1s infinite; }
    .location-dot.ok { background: #34c759; }
    .location-dot.fail { background: #ff3b30; }
    .location-text span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh-btn { color: #007aff; font-size: 13px; padding: 4px 8px; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

    .add-section {
        background: #fff; padding: 12px; display: flex; gap: 8px; align-items: flex-start;
        position: sticky; top: 88px; z-index: 9; border-bottom: 1px solid #e5e5ea;
    }
    .input-wrap { flex: 1; position: relative; }
    .address-input {
        width: 100%; padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 10px;
        font-size: 15px; outline: none;
    }
    .address-input:focus { border-color: #007aff; }

    /* 下拉列表 */
    .suggestions {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0;
        background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
        max-height: 320px; overflow-y: auto; z-index: 20; display: none;
    }
    .suggestions.active { display: block; }
    .suggestion-item { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #f2f2f7; }
    .suggestion-name { font-size: 15px; color: #1c1c1e; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .suggestion-name em { color: #007aff; font-style: normal; font-weight: 600; }
    .suggestion-dist { font-size: 12px; color: #34c759; flex-shrink: 0; font-weight: 500; }
    .suggestion-address { font-size: 12px; color: #999; margin-top: 2px; }
    .suggestion-empty { padding: 12px; font-size: 13px; color: #999; text-align: center; }

    .btn-add {
        background: #007aff; color: #fff; border: none; padding: 10px 18px;
        border-radius: 10px; font-size: 15px; font-weight: 500; white-space: nowrap;
    }

    .list { padding: 12px; }
    .list-title { font-size: 14px; color: #666; margin-bottom: 8px; }
    .addr-card {
        background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px;
        display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04);
        cursor: pointer;
    }
    .addr-icon {
        width: 40px; height: 40px; border-radius: 8px; background: #e8f0fe;
        display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    .addr-info { flex: 1; overflow: hidden; }
    .addr-name { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr-coord { font-size: 12px; color: #999; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .addr-dist { color: #34c759; font-weight: 500; }
    .addr-delete {
        color: #ff3b30; font-size: 20px; padding: 4px 8px; flex-shrink: 0; line-height: 1;
    }
    .empty { text-align: center; color: #999; padding: 60px 20px; }

    .footer-tip { text-align: center; font-size: 12px; color: #999; margin-top: 20px; padding: 0 20px; }

    .toast {
        position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 8px;
        font-size: 14px; z-index: 100; opacity: 0; transition: opacity .3s; white-space: nowrap;
    }
    .toast.active { opacity: 1; }

    .key-tip {
        margin: 12px; padding: 12px 14px; background: #fff4e5; border: 1px solid #ffd591;
        border-radius: 10px; font-size: 13px; color: #8a6d3b; line-height: 1.7;
    }
    .key-tip code { background: #f0f0f0; padding: 1px 5px; border-radius: 3px; font-family: monospace; }
    .key-tip a { color: #007aff; }

    .loc-action {
        background: #e8f0fe; color: #007aff; border: none; padding: 8px 12px;
        border-radius: 8px; font-size: 13px; margin: 0 12px 10px; display: block; width: calc(100% - 24px);
        text-align: left; cursor: pointer;
    }
    .loc-action:active { opacity: .7; }
</style>
</head>
<body>

<div class="header">
    <div class="title">导航地址管理</div>
    <div class="location-bar">
        <div class="location-text">
            <div class="location-dot" id="locDot"></div>
            <span id="locText">正在定位…</span>
        </div>
        <div class="refresh-btn" onclick="getCurrentLocation(false)">刷新</div>
    </div>
</div>

<div class="add-section">
    <div class="input-wrap">
        <input type="text" class="address-input" id="addressInput" placeholder="输入地名/店名，如：超市、学校" autocomplete="off">
        <div class="suggestions" id="suggestions"></div>
    </div>
    <button class="btn-add" onclick="manualAdd()">添加</button>
</div>

<!-- 「当前位置」快捷添加按钮（定位成功后显示） -->
<button class="loc-action" id="locAction" style="display:none;" onclick="addCurrentLocation()">
    ➕ 将「当前位置」加入导航列表
</button>

<div class="list" id="listContainer"></div>

<div class="footer-tip">点击地址卡片可直接跳转高德地图导航 🗺️</div>

<!-- Key 自检诊断提示（正常时隐藏，异常时显示具体原因） -->
<div id="keyTip" class="key-tip" style="display:none;"></div>

<div class="toast" id="toast"></div>

<script>
    // ==================== ⚠️ Key 配置 ====================
    //   AMAP_WEB_KEY ：「Web 服务」Key —— 搜索 / 逆地理编码（restapi.amap.com）
    //   AMAP_JS_KEY  ：「Web 端 (JS API)」Key —— 仅嵌入地图时用（本文件未用，可留空）
    //   你的 bd1097f2… 是「Web 端 JS API」Key，不能直接调 restapi，需再建一个「Web 服务」Key 填下面
    const AMAP_WEB_KEY = 'aafb549191e1ababd28f5327c82fc911';                                    // ← 填「Web 服务」Key
    const AMAP_JS_KEY  = 'bd1097f295862bc1d063bd88fc7cf3d8';    // 已填（JS API Key，本文件未使用）
    const AMAP_SEC_CODE = 'e6da02c3eecd8f5dd6e09278a29da2ce';   // 安全密钥（本文件未使用）

    // ==================== 全局状态 ====================
    let addresses = JSON.parse(localStorage.getItem('navAddresses') || '[]');
    let currentPos = null;       // {lng, lat}
    let currentAddr = '';        // 定位详细地址（市·区·街道…）
    let currentCity = '';        // 市级，用于搜索
    let currentDistrict = '';    // 区/县级，用于缩小搜索范围

    // ==================== 初始化 ====================
    function init() {
        renderList();
        runKeyCheck();
        getCurrentLocation(true);
        bindInput();
    }

    // ==================== Key 自检 ====================
    function runKeyCheck() {
        const tipEl = document.getElementById('keyTip');
        if (!AMAP_WEB_KEY) {
            tipEl.style.display = 'block';
            tipEl.innerHTML = '⚠️ <b>搜索不可用</b>：请在高德控制台「添加 Key → 服务平台选 <b>Web 服务</b>」，把生成的 Key 填到代码顶部 <code>AMAP_WEB_KEY</code>。<br>'
                          + '你当前的 <code>bd1097f2…</code> 是「Web 端 JS API」Key，不能调搜索接口（restapi.amap.com）。<br>'
                          + '👉 <a href="https://console.amap.com/" target="_blank" style="color:#007aff;">前往控制台新建</a> → 填好后再测。';
            return;
        }
        fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=116.397428,39.90923&extensions=base&output=json`)
            .then(r => r.json())
            .then(d => {
                if (d.status === '1') { tipEl.style.display = 'none'; }
                else if (d.infocode === '10001') {
                    tipEl.style.display = 'block';
                    tipEl.innerHTML = '⚠️ Key 无效/过期（INVALID_USER_KEY）。请确认 <code>AMAP_WEB_KEY</code> 是<b>「Web 服务」</b>类型且未过期。';
                } else if (d.infocode === '10020' || d.info === 'USERKEY_PLAT_NOMATCH') {
                    tipEl.style.display = 'block';
                    tipEl.innerHTML = '⚠️ Key 类型不匹配：<code>AMAP_WEB_KEY</code> 必须是「<b>Web 服务</b>」Key，不能是 JS API / iOS / Android Key。';
                } else {
                    tipEl.style.display = 'block';
                    tipEl.innerHTML = `⚠️ 接口返回：${d.info}（${d.infocode}）。请检查 Key 类型与权限。`;
                }
            })
            .catch(() => {});
    }

    // ==================== Toast ====================
    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('active');
        setTimeout(() => t.classList.remove('active'), 2000);
    }

    // ==================== 定位状态 ====================
    function setLocStatus(state, text) {
        const dot = document.getElementById('locDot');
        const txt = document.getElementById('locText');
        dot.className = 'location-dot ' + state;
        txt.textContent = text;
    }

    // ==================== 功能①：自动定位（精确到街道） ====================
    function getCurrentLocation(silent) {
        setLocStatus('loading', silent ? '正在定位…' : '重新定位中…');
        if (!navigator.geolocation) {
            setLocStatus('fail', '浏览器不支持定位');
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos) => onLocateSuccess(pos.coords.longitude, pos.coords.latitude),
            (err) => {
                console.warn('定位失败', err);
                setLocStatus('fail', '定位失败，可点击刷新重试');
                if (!silent) showToast('定位失败');
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
        );
    }

    // 定位成功 → 保存坐标 + 逆地理编码拿 市/区/街道 详细地址
    function onLocateSuccess(lng, lat) {
        currentPos = { lng, lat };
        setLocStatus('ok', '当前位置：已获取');
        reverseGeocode(lat, lng, (info) => {
            if (info) {
                currentCity = info.city;
                currentDistrict = info.district;
                currentAddr = info.full;
                // 显示精确到街道的地址
                setLocStatus('ok', `当前位置：${info.full}`);
                // 定位更精细 → 重建搜索范围，后续搜索结果更准
                document.getElementById('locAction').style.display = 'block';
            }
        });
        showToast('定位成功');
    }

    // 逆地理编码：经纬度 → 市/区/街道（extensions=base 即可，省流量）
    // 返回 { city, district, full }
    function reverseGeocode(lat, lng, cb) {
        if (!AMAP_WEB_KEY) { cb(null); return; }
        const url = `https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=${lng},${lat}&radius=1000&extensions=base&output=json`;
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.status === '1' && data.regeocode) {
                    const c = data.regeocode.addressComponent || {};
                    const city = c.city || c.district || c.province || '';
                    const district = c.district || '';
                    const township = c.township || '';
                    // 拼出"市·区·街道"；街道级可能为空（精度不够时）
                    const parts = [city, district, township].filter(Boolean);
                    cb({
                        city,
                        district,
                        full: parts.join('·') || data.regeocode.formatted_address || city
                    });
                } else cb(null);
            })
            .catch(() => cb(null));
    }

    // ==================== 工具：直线距离计算（Haversine 公式） ====================
    // 返回米数；足够精确，误差在 1% 以内
    function calcDistance(lng1, lat1, lng2, lat2) {
        const R = 6371000; // 地球平均半径（米）
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat/2) * Math.sin(dLat/2)
                + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
                * Math.sin(dLng/2) * Math.sin(dLng/2);
        return 2 * R * Math.asin(Math.sqrt(a));
    }
    function formatDist(m) {
        if (m == null || isNaN(m)) return '';
        if (m < 1000) return Math.round(m) + 'm';
        return (m / 1000).toFixed(1) + 'km';
    }

    // ==================== 功能②：搜索下拉（带距离、按近到远排序） ====================
    function bindInput() {
        const input = document.getElementById('addressInput');
        let timer = null;
        input.addEventListener('input', function () {
            const kw = this.value.trim();
            if (!kw) { hideSuggestions(); return; }
            clearTimeout(timer);
            timer = setTimeout(() => doSearch(kw), 350);
        });
        input.addEventListener('blur', () => setTimeout(hideSuggestions, 200));
        input.addEventListener('focus', () => {
            if (input.value.trim()) doSearch(input.value.trim());
        });
    }

    function doSearch(keyword) {
        if (!AMAP_WEB_KEY) { renderKeyMissing(keyword); return; }

        // 搜索中心 = 当前定位坐标；有定位时缩小到「区/县」级别，比全市更精准
        const center = currentPos ? `${currentPos.lng},${currentPos.lat}` : '';
        const city = currentDistrict ? encodeURIComponent(currentDistrict)
                  : (currentCity ? encodeURIComponent(currentCity) : '全国');

        let url = `https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=${city}&citylimit=false&offset=25&output=json`;
        if (center) url += `&location=${center}&radius=50000`;

        fetch(url)
            .then(r => r.json())
            .then(data => {
                let pois = (data.status === '1' && data.pois) ? data.pois : [];
                if (pois.length === 0 && center) {
                    // 本区无结果 → 放宽到全国再搜
                    return fetch(`https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=全国&offset=25&output=json`)
                        .then(r => r.json())
                        .then(d2 => { renderPois((d2.status === '1' && d2.pois) ? d2.pois : [], keyword); });
                }
                renderPois(pois, keyword);
            })
            .catch(err => {
                console.error('搜索请求失败', err);
                renderNetError(keyword);
            });
    }

    // 给 POI 计算距离，并按由近到远排序
    function attachDistance(pois) {
        if (!currentPos) return pois;
        return pois.map(p => {
            const loc = p.location ? p.location.split(',') : [null, null];
            const lon = parseFloat(loc[0]), lat = parseFloat(loc[1]);
            const dist = (lon && lat) ? calcDistance(currentPos.lng, currentPos.lat, lon, lat) : null;
            return Object.assign({}, p, { _dist: dist });
        }).sort((a, b) => (a._dist == null ? 1e15 : a._dist) - (b._dist == null ? 1e15 : b._dist));
    }

    function renderPois(pois, keyword) {
        const box = document.getElementById('suggestions');
        if (!pois || pois.length === 0) { renderEmpty(keyword); return; }

        const sorted = attachDistance(pois);
        const reg = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        box.innerHTML = sorted.map(p => {
            const name = (p.name || '').replace(reg, m => `<em>${m}</em>`);
            const addr = p.pname ? `${p.pname}${p.cityname ? '·'+p.cityname : ''}${p.adname ? '·'+p.adname : ''}` : (p.address || '');
            const loc = p.location ? p.location.split(',') : [0, 0];
            const distHtml = p._dist != null ? `<span class="suggestion-dist">${formatDist(p._dist)}</span>` : '';
            return `<div class="suggestion-item" data-name="${escapeAttr(p.name)}" data-lon="${loc[0]}" data-lat="${loc[1]}">
                <div class="suggestion-name">${name}${distHtml}</div>
                <div class="suggestion-address">${addr}</div>
            </div>`;
        }).join('');
        box.classList.add('active');

        box.querySelectorAll('.suggestion-item').forEach(el => {
            el.addEventListener('mousedown', e => { e.preventDefault(); pickSuggestion(el); });
            el.addEventListener('touchstart', e => { e.preventDefault(); pickSuggestion(el); }, { passive: false });
        });
    }

    function renderKeyMissing(keyword) {
        const box = document.getElementById('suggestions');
        box.innerHTML = `<div class="suggestion-empty" style="text-align:left;line-height:1.6;">
            ⚠️ 搜索暂不可用<br>请新建一个「<b>Web 服务</b>」类型的 Key 填入代码顶部。<br>
            <a href="https://console.amap.com/" target="_blank" style="color:#007aff;">前往控制台 → 添加 Key → 选 Web 服务</a></div>`;
        box.classList.add('active');
    }
    function renderNetError(keyword) {
        const box = document.getElementById('suggestions');
        box.innerHTML = `<div class="suggestion-empty">网络异常，请检查后重试</div>`;
        box.classList.add('active');
    }
    function renderEmpty(keyword) {
        const box = document.getElementById('suggestions');
        box.innerHTML = `<div class="suggestion-empty">无搜索结果，点「添加」将以「${escapeHtml(keyword)}」名称手动添加</div>`;
        box.classList.add('active');
    }
    function hideSuggestions() {
        document.getElementById('suggestions').classList.remove('active');
    }

    // 选中下拉项 → 添加
    function pickSuggestion(el) {
        const name = el.dataset.name;
        const lon = parseFloat(el.dataset.lon);
        const lat = parseFloat(el.dataset.lat);
        if (!name || isNaN(lon)) { hideSuggestions(); return; }
        addresses.push({ name, lon, lat });
        saveAndRender();
        document.getElementById('addressInput').value = '';
        hideSuggestions();
        showToast('已添加');
    }

    // ==================== 「当前位置」快捷添加 ====================
    function addCurrentLocation() {
        if (!currentPos) { showToast('暂未获取到当前位置'); return; }
        // 避免重复添加
        const exist = addresses.find(a => a._isCurrent);
        if (exist) { showToast('当前位置已在列表中'); return; }
        const name = currentAddr ? `📍 当前位置（${currentAddr}）` : '📍 当前位置';
        addresses.unshift({ name, lon: currentPos.lng, lat: currentPos.lat, _isCurrent: true });
        saveAndRender();
        showToast('已添加当前位置');
    }

    // 手动添加（未选下拉时）
    function manualAdd() {
        const input = document.getElementById('addressInput');
        const name = input.value.trim();
        if (!name) { showToast('请输入地名'); return; }
        if (currentPos) {
            addresses.push({ name, lon: currentPos.lng, lat: currentPos.lat });
            saveAndRender();
            input.value = '';
            hideSuggestions();
            showToast('已添加（坐标为当前位置，建议从下拉选择更精确）');
        } else {
            showCoordModal(name);
        }
    }

    function showCoordModal(name) {
        const coord = prompt('请输入经纬度（经度,纬度，如：109.73,38.28）', '');
        if (!coord) return;
        const parts = coord.split(',').map(Number);
        if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) { showToast('格式错误'); return; }
        addresses.push({ name, lon: parts[0], lat: parts[1] });
        saveAndRender();
        document.getElementById('addressInput').value = '';
        showToast('已添加');
    }

    // ==================== 列表渲染（带距离、当前位置标记） ====================
    function renderList() {
        const container = document.getElementById('listContainer');
        if (addresses.length === 0) {
            container.innerHTML = '<div class="empty">暂无地址，添加后点击即可导航</div>';
            return;
        }
        // 列表也按距离排序（当前位置不参与，排最前）
        const sorted = sortAddresses(addresses);
        container.innerHTML = '<div class="list-title">已添加地址（点击跳转导航）</div>' +
            sorted.map((a, i) => {
                const dist = (currentPos && !a._isCurrent)
                    ? calcDistance(currentPos.lng, currentPos.lat, a.lon, a.lat) : null;
                const distHtml = dist != null
                    ? `<span class="addr-dist">· ${formatDist(dist)}</span>` : '';
                const tag = a._isCurrent ? '<span class="addr-dist">当前位置</span>' : '';
                return `
                <div class="addr-card" onclick="jumpToNav(${i})">
                    <div class="addr-icon">${a._isCurrent ? '🧭' : '📍'}</div>
                    <div class="addr-info">
                        <div class="addr-name">${escapeHtml(a.name)}</div>
                        <div class="addr-coord">${a.lat.toFixed(4)}, ${a.lon.toFixed(4)}${distHtml}${tag}</div>
                    </div>
                    <div class="addr-delete" onclick="deleteAddr(event, ${i})">×</div>
                </div>`;
            }).join('');
    }

    // 列表排序：当前位置置顶，其余按距离由近到远
    function sortAddresses(list) {
        return list.slice().sort((a, b) => {
            if (a._isCurrent && !b._isCurrent) return -1;
            if (!a._isCurrent && b._isCurrent) return 1;
            if (!currentPos) return 0;
            const da = calcDistance(currentPos.lng, currentPos.lat, a.lon, a.lat);
            const db = calcDistance(currentPos.lng, currentPos.lat, b.lon, b.lat);
            return da - db;
        });
    }

    // 删除
    function deleteAddr(e, i) {
        e.stopPropagation();
        addresses.splice(i, 1);
        saveAndRender();
        showToast('已删除');
    }

    // ==================== 功能③：跳转高德地图导航 ====================
    function jumpToNav(i) {
        const a = addresses[i];
        if (!a) return;
        const slat = currentPos ? currentPos.lat : '';
        const slon = currentPos ? currentPos.lng : '';
        let amapUrl;
        if (currentPos) {
            amapUrl = `iosamap://path?sourceApplication=navApp&sid=current&slat=${slat}&slon=${slon}&sname=我的位置&did=目的地&dlat=${a.lat}&dlon=${a.lon}&dname=${encodeURIComponent(a.name)}&t=0`;
        } else {
            amapUrl = `iosamap://navi?sourceApplication=navApp&poiname=${encodeURIComponent(a.name)}&lat=${a.lat}&lon=${a.lon}&dev=0&style=2`;
        }
        window.location.href = amapUrl;
        setTimeout(() => {
            const webUrl = `https://uri.amap.com/navigation?to=${a.lon},${a.lat},${encodeURIComponent(a.name)}&mode=car&policy=1`;
            window.open(webUrl, '_blank');
        }, 1500);
    }

    // ==================== 工具 ====================
    function saveAndRender() {
        localStorage.setItem('navAddresses', JSON.stringify(addresses));
        renderList();
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    // ==================== 启动 ====================
    init();
</script>
</body>
</html>
