<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>导航地址管理</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f2f7; }
    .page { background: #f2f2f7; min-height: 100vh; padding-bottom: 40px; }
    .header { background: #fff; padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #e5e5ea; }
    .title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 12px; }
    .location-bar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #666; }
    .location-text { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; }
    .location-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .location-dot.loading { background: #f0ad4e; }
    .location-dot.ok { background: #34c759; }
    .location-dot.fail { background: #ff3b30; }
    .location-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh-btn { color: #007aff; font-size: 13px; padding: 4px 8px; flex-shrink: 0; cursor: pointer; }
    .add-section { background: #fff; padding: 12px; display: flex; gap: 8px; align-items: flex-start; position: sticky; top: 73px; z-index: 9; border-bottom: 1px solid #e5e5ea; }
    .input-wrap { flex: 1; position: relative; }
    .address-input { width: 100%; padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box; }
    .address-input:focus { border-color: #007aff; }
    .suggestions { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); max-height: 320px; overflow-y: auto; z-index: 20; }
    .suggestion-item { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #f2f2f7; }
    .suggestion-name { font-size: 15px; color: #1c1c1e; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .suggestion-dist { font-size: 12px; color: #34c759; flex-shrink: 0; font-weight: 500; }
    .suggestion-address { font-size: 12px; color: #999; margin-top: 2px; }
    .btn-add { background: #007aff; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; }
    .loc-action { background: #e8f0fe; color: #007aff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 0 12px 10px; text-align: left; width: calc(100% - 24px); cursor: pointer; }
    .list { padding: 12px; }
    .list-title { font-size: 14px; color: #666; margin-bottom: 8px; }
    .addr-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); cursor: pointer; }
    .addr-icon { width: 40px; height: 40px; border-radius: 8px; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .addr-info { flex: 1; overflow: hidden; }
    .addr-name { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr-coord { font-size: 12px; color: #999; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .addr-dist { color: #34c759; font-weight: 500; }
    .addr-delete { color: #ff3b30; font-size: 20px; padding: 4px 8px; flex-shrink: 0; line-height: 1; cursor: pointer; }
    .addr-edit { color: #007aff; padding: 4px 8px; flex-shrink: 0; cursor: pointer; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; }
    .addr-edit svg { width: 18px; height: 18px; }
    .addr-name-input { font-size: 16px; font-weight: 500; border: 1px solid #007aff; border-radius: 6px; padding: 4px 8px; width: 100%; outline: none; box-sizing: border-box; background: #fff; }
    .addr-remark { font-size: 12px; color: #666; margin-top: 3px; padding: 2px 0; word-break: break-all; }
    .addr-remark.empty { color: #c7c7cc; font-style: normal; }
    .edit-actions { display: flex; gap: 6px; margin-top: 6px; }
    .edit-actions button { flex: 1; padding: 8px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .edit-actions .btn-save { background: #007aff; color: #fff; font-weight: 500; }
    .edit-actions .btn-cancel { background: #f2f2f7; color: #333; }
    .edit-actions .btn-remark { background: #e8f0fe; color: #007aff; }
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .modal { background: #fff; border-radius: 14px; padding: 18px; width: 100%; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
    .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 14px; }
    .modal-label { font-size: 13px; color: #666; margin: 10px 0 6px; }
    .modal input, .modal textarea { width: 100%; padding: 10px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box; font-family: inherit; }
    .modal textarea { min-height: 72px; resize: vertical; }
    .modal input:focus, .modal textarea:focus { border-color: #007aff; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button { flex: 1; padding: 11px; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; }
    .modal-actions .btn-confirm { background: #007aff; color: #fff; }
    .modal-actions .btn-cancel { background: #f2f2f7; color: #333; }
    .empty { text-align: center; color: #999; padding: 60px 20px; }
    .footer-tip { text-align: center; font-size: 12px; color: #999; margin-top: 20px; padding: 0 20px; }
    .key-tip { margin: 12px; padding: 12px 14px; background: #fff4e5; border: 1px solid #ffd591; border-radius: 10px; font-size: 13px; color: #8a6d3b; line-height: 1.7; }
    .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 100; white-space: nowrap; }
    .diag { margin: 12px; padding: 10px 12px; background: #eef; border: 1px solid #ccd; border-radius: 10px; font-size: 12px; color: #335; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="page">
    <div class="header">
        <div class="title">导航地址管理</div>
        <div class="location-bar">
            <div class="location-text">
                <div class="location-dot" id="locDot"></div>
                <span class="location-label" id="locText">正在定位…</span>
            </div>
            <span class="refresh-btn" id="refreshBtn">刷新</span>
        </div>
    </div>

    <div class="add-section">
        <div class="input-wrap">
            <input class="address-input" id="keyword" placeholder="输入地名/店名，如：超市、学校" autocomplete="off">
            <div class="suggestions" id="suggestBox"></div>
        </div>
        <button class="btn-add" id="addBtn">添加</button>
    </div>

    <button class="loc-action" id="locAction" style="display:none">➕ 记录「当前位置」(搜不到地址时用它）</button>

    <div class="list" id="listBox"></div>
    <div class="empty" id="emptyBox">暂无地址，添加后点击即可导航</div>

    <div class="footer-tip">点击地址卡片可直接跳转高德地图导航 </div>
    <div class="key-tip" id="keyTip"></div>
    <div class="diag" id="diagBox"></div>

    <div class="modal-mask" id="editModal" style="display:none">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-title">编辑地址</div>
            <div class="modal-label">名称（可改为简短别名）</div>
            <input type="text" id="editName" placeholder="如：公司、接娃、常去超市" maxlength="40">
            <div class="modal-label">备注（选填）</div>
            <textarea id="editRemark" placeholder="如：B1层停车场、走西门最近、张经理 138xxxx"></textarea>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEdit()">取消</button>
                <button class="btn-confirm" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
const AMAP_WEB_KEY = 'aafb549191e1ababd28f5327c82fc911';

let _idSeed = 1;
function genId() { return Date.now().toString(36) + '_' + (_idSeed++).toString(36); }

function isValidCoord(lon, lat) {
    const lo = parseFloat(lon);
    const la = parseFloat(lat);
    return !isNaN(lo) && !isNaN(la) && lo >= -180 && lo <= 180 && la >= -90 && la <= 90;
}

function formatAccuracy(accuracy) {
    if (!accuracy || isNaN(accuracy)) return '';
    return accuracy < 1000 ? `±${Math.round(accuracy)}米` : `±${(accuracy / 1000).toFixed(1)}公里`;
}

const A = 6378245.0, EE = 0.00669342162296594323, PI = Math.PI, X_PI = PI * 3000.0 / 180.0;
function transformLat(x, y) {
    let r = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin(y / 3.0 * PI)) * 2.0 / 3.0;
    r += (160.0 * Math.sin(y / 12.0 * PI) + 320 * Math.sin(y * PI / 30.0)) * 2.0 / 3.0;
    return r;
}
function transformLon(x, y) {
    let r = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
    r += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin(x / 3.0 * PI)) * 2.0 / 3.0;
    r += (150.0 * Math.sin(x / 12.0 * PI) + 300.0 * Math.sin(x / 30.0 * PI)) * 2.0 / 3.0;
    return r;
}
function wgs84ToGcj02(lon, lat) {
    if (lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271) return { lon, lat };
    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * PI, magic = 1 - EE * Math.sin(radLat) * Math.sin(radLat);
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
    dLon = (dLon * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
    return { lon: lon + dLon, lat: lat + dLat };
}

function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
}

const state = {
    keyword: '',
    addresses: [],       
    currentPos: null,     
    rawPos: null,        
    currentAddr: '',
    currentCity: '',
    currentDistrict: '',
    suggestions: [],
    timer: null,
};

const $ = (id) => document.getElementById(id);
const elLocDot = $('locDot');
const elLocText = $('locText');
const elKeyword = $('keyword');
const elSuggestBox = $('suggestBox');
const elListBox = $('listBox');
const elEmptyBox = $('emptyBox');
const elLocAction = $('locAction');
const elKeyTip = $('keyTip');
const elDiag = $('diagBox');

function setLoc(state_, text) {
    elLocDot.className = 'location-dot ' + state_;
    elLocText.textContent = text;
}

function load() {
    try {
        const saved = localStorage.getItem('navAddresses');
        if (saved) {
            state.addresses = JSON.parse(saved).map(a => { if (!a.id) a.id = genId(); if (!('remark' in a)) a.remark = ''; return a; });
        }
    } catch (e) {}
    render();
}
function save() {
    localStorage.setItem('navAddresses', JSON.stringify(state.addresses));
}

function runKeyCheck() {
    if (!AMAP_WEB_KEY) {
        elKeyTip.textContent = '⚠️ 搜索不可用：请填 AMAP_WEB_KEY（Web 服务 Key）。定位与导航不受影响。';
        return;
    }
    fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=116.397428,39.90923&extensions=base`)
        .then(r => r.json()).then(d => {
            if (d.status === '1') elKeyTip.textContent = '';
            else if (d.infocode === '10001') elKeyTip.textContent = '⚠️ Key 无效/过期';
            else if (d.infocode === '10020' || d.info === 'USERKEY_PLAT_NOMATCH') elKeyTip.textContent = '⚠️ Key 类型不匹配：必须是「Web 服务」Key';
            else elKeyTip.textContent = `⚠️ ${d.info}（${d.infocode}）`;
        }).catch(() => {});
}

function getCurrentLocation(silent) {
    setLoc('loading', silent ? '正在定位…' : '重新定位中…');
    const done = (lng, lat, accuracy) => {
        if (!isValidCoord(lng, lat)) { setLoc('fail', '定位坐标异常，可点击刷新重试'); return; }
        const gcj = wgs84ToGcj02(lng, lat); 
        state.currentPos = { lng: gcj.lon, lat: gcj.lat };
        state.rawPos = { accuracy: accuracy || null };
        setLoc('ok', '当前位置：已获取');
        reverseGeocode(gcj.lat, gcj.lon);
        render();
    };
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => done(pos.coords.longitude, pos.coords.latitude, pos.coords.accuracy),
            (err) => {
                console.warn('HTML5 定位失败，尝试 IP 定位', err);
                ipLocate();
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        ipLocate();
    }
}
function ipLocate() {
    if (!AMAP_WEB_KEY) { setLoc('fail', '定位失败，可点击刷新重试'); return; }
    fetch(`https://restapi.amap.com/v3/ip?key=${AMAP_WEB_KEY}`)
        .then(r => r.json()).then(d => {
            if (d.status === '1' && d.rectangle) {
                const c = d.rectangle.split(';')[0].split(',');
                const lng = parseFloat(c[0]), lat = parseFloat(c[1]);
                if (isValidCoord(lng, lat)) {
                    state.currentPos = { lng, lat };
                    state.rawPos = { accuracy: 1000 }; 
                    setLoc('ok', '当前位置：' + (d.city || '已获取'));
                    reverseGeocode(lat, lng);
                    render();
                    return;
                }
            }
            setLoc('fail', '定位失败，可点击刷新重试');
        }).catch(() => setLoc('fail', '定位失败，可点击刷新重试'));
}
function reverseGeocode(lat, lng) {
    if (!AMAP_WEB_KEY) return;
    fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=${lng},${lat}&radius=1000&extensions=base`)
        .then(r => r.json()).then(d => {
            if (d.status === '1' && d.regeocode) {
                const c = d.regeocode.addressComponent || {};
                const parts = [c.city || c.district || c.province, c.district, c.township].filter(Boolean);
                state.currentCity = c.city || c.district || '';
                state.currentDistrict = c.district || '';
                state.currentAddr = parts.join('·') || d.regeocode.formatted_address || state.currentCity;
                setLoc('ok', `当前位置：${state.currentAddr}`);
                render();
            }
        }).catch(() => {});
}
function onInput() {
    const kw = elKeyword.value.trim();
    state.keyword = kw;
    if (!kw) { elSuggestBox.innerHTML = ''; return; }
    clearTimeout(state.timer);
    state.timer = setTimeout(() => doSearch(kw), 350);
}
function doSearch(keyword) {
    if (!AMAP_WEB_KEY) { renderSuggest([]); return; }
    const center = state.currentPos ? `${state.currentPos.lng},${state.currentPos.lat}` : '';
    const city = state.currentDistrict ? encodeURIComponent(state.currentDistrict)
        : (state.currentCity ? encodeURIComponent(state.currentCity) : '全国');
    let url = `https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=${city}&citylimit=false&offset=25`;
    if (center) url += `&location=${center}&radius=50000`;
    fetch(url).then(r => r.json()).then(d => {
        let pois = (d.status === '1' && d.pois) ? d.pois : [];
        if (!pois.length && center) {
            return fetch(`https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=全国&offset=25`)
                .then(r => r.json()).then(d2 => renderSuggest((d2.status === '1' && d2.pois) ? d2.pois : []));
        }
        renderSuggest(pois);
    }).catch(() => renderSuggest([]));
}
function renderSuggest(pois) {
    state.suggestions = pois.map(p => {
        const loc = p.location ? p.location.split(',') : [null, null];
        const lon = parseFloat(loc[0]), lat = parseFloat(loc[1]);
        const dist = (isValidCoord(lon, lat) && state.currentPos) ? calcDistance(state.currentPos.lng, state.currentPos.lat, lon, lat) : null;
        return Object.assign({}, p, { lon, lat, _dist: dist });
    }).sort((a, b) => (a._dist == null ? 1e15 : a._dist) - (b._dist == null ? 1e15 : b._dist));
    elSuggestBox.innerHTML = state.suggestions.slice(0, 15).map(p => {
        const dist = (p._dist != null) ? `<span class="suggestion-dist">${formatDist(p._dist)}</span>` : '';
        return `<div class="suggestion-item" data-name="${escapeAttr(p.name)}" data-lon="${p.lon}" data-lat="${p.lat}">
            <div class="suggestion-name">${highlight(p.name)}${dist}</div>
            <div class="suggestion-address">${p.adname || p.address || ''}</div>
        </div>`;
    }).join('');
}
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function highlight(name) {
    const kw = state.keyword.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (!kw) return escapeHtml(name);
    return escapeHtml(name).replace(new RegExp(kw, 'gi'), m => `<span style="color:#007aff;font-weight:600">${m}</span>`);
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function formatDist(m) { if (m == null || isNaN(m)) return ''; return m < 1000 ? Math.round(m) + 'm' : (m / 1000).toFixed(1) + 'km'; }
function calcDistance(lng1, lat1, lng2, lat2) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

function pickSuggestion(el) {
    const p = { name: el.dataset.name, lon: el.dataset.lon, lat: el.dataset.lat };
    if (!p.name || !isValidCoord(p.lon, p.lat)) { toast('该地点缺少坐标，请换一个'); elSuggestBox.innerHTML = ''; return; }
    state.addresses.push({ id: genId(), name: p.name, lon: parseFloat(p.lon), lat: parseFloat(p.lat), remark: '' });
    save(); elKeyword.value = ''; elSuggestBox.innerHTML = ''; toast('已添加'); render();
}

function addCurrentLocation() {
    if (!state.currentPos) { toast('暂未获取到当前位置，请先点刷新'); return; }
    if (!isValidCoord(state.currentPos.lng, state.currentPos.lat)) { toast('当前定位坐标无效，请刷新重试'); return; }

    const acc = state.rawPos ? state.rawPos.accuracy : null;
    if (acc > 100) toast('定位精度较低，已按大致位置添加');

    const time = new Date();
    const hh = String(time.getHours()).padStart(2, '0');
    const mm = String(time.getMinutes()).padStart(2, '0');
    const addrPart = state.currentAddr || '附近';
    const name = `📍 当前位置 ${hh}:${mm}（${addrPart}）`;
    const remark = acc ? `精度约${formatAccuracy(acc)}` : '';

    state.addresses.unshift({ id: genId(), name, lon: state.currentPos.lng, lat: state.currentPos.lat, _fromCurrent: true, remark });
    save(); render();
    toast('已记录此刻位置');
}

function manualAdd() {
    const name = elKeyword.value.trim();
    if (!name) { toast('请输入地名'); return; }
    if (state.currentPos) {
        if (!isValidCoord(state.currentPos.lng, state.currentPos.lat)) { toast('当前定位坐标无效'); return; }
        state.addresses.push({ id: genId(), name, lon: state.currentPos.lng, lat: state.currentPos.lat, remark: '' });
        save(); elKeyword.value = ''; toast('已添加（坐标为当前位置）'); render();
    } else {
        const coord = prompt('未定位，请输入经纬度（经度,纬度，如 109.73,38.28）');
        if (!coord) return;
        const parts = coord.split(',').map(Number);
        if (parts.length !== 2 || !isValidCoord(parts[0], parts[1])) { toast('格式错误或坐标超范围'); return; }
        state.addresses.push({ id: genId(), name, lon: parts[0], lat: parts[1], remark: '' });
        save(); elKeyword.value = ''; render();
    }
}

function deleteAddr(id) {
    if (id == null) return;
    const idx = state.addresses.findIndex(a => a.id === id);
    if (idx > -1) { state.addresses.splice(idx, 1); save(); render(); }
}

let editingId = null;

function openEdit(id) {
    const addr = state.addresses.find(a => a.id === id);
    if (!addr) return;
    editingId = id;
    $('editName').value = addr.name || '';
    $('editRemark').value = addr.remark || '';
    $('editModal').style.display = 'flex';
    setTimeout(() => $('editName').focus(), 50);
}
function closeEdit() {
    editingId = null;
    $('editModal').style.display = 'none';
}
function saveEdit() {
    const addr = state.addresses.find(a => a.id === editingId);
    if (!addr) { closeEdit(); return; }
    const newName = $('editName').value.trim();
    if (!newName) { toast('名称不能为空'); $('editName').focus(); return; }
    addr.name = newName;
    addr.remark = $('editRemark').value.trim();
    save(); closeEdit(); render();
    toast('已保存');
}

window.openEdit = openEdit;
window.closeEdit = closeEdit;
window.saveEdit = saveEdit;

function jumpToNav(a) {
    if (!a) return;
    const lon = parseFloat(a.lon);
    const lat = parseFloat(a.lat);
    if (!isValidCoord(lon, lat)) { console.warn('坐标无效', a); toast('该地址坐标无效，请重新添加'); return; }
    const name = (a.name && String(a.name).trim()) || '目的地';

    const slat = state.currentPos ? state.currentPos.lat : '';
    const slon = state.currentPos ? state.currentPos.lng : '';
    let scheme;
    if (state.currentPos) {
        scheme = `iosamap://path?sourceApplication=navapp&sid=current&slat=${slat}&slon=${slon}&sname=我的位置&dlat=${lat}&dlon=${lon}&dname=${encodeURIComponent(name)}&t=0`;
    } else {
        scheme = `iosamap://navi?sourceApplication=navapp&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lon}&dev=0&style=2`;
    }
    const web = `https://uri.amap.com/navigation?to=${lon},${lat},${encodeURIComponent(name)}&mode=car&policy=1`;

    elDiag.textContent = `跳转: ${name}\n坐标: ${lat},${lon}\n${scheme}`;
    console.log('跳转高德:', name, lat, lon, scheme);

    window.location.href = scheme;
    const t = Date.now();
    setTimeout(() => {
        if (Date.now() - t < 2000 && !document.hidden) window.open(web, '_blank');
    }, 1500);
}

function sortedAddresses() 
    if (!state.currentPos) return state.addresses.slice();
    return state.addresses.slice().sort((a, b) => {
        const da = calcDistance(state.currentPos.lng, state.currentPos.lat, a.lon, a.lat);
        const db = calcDistance(state.currentPos.lng, state.currentPos.lat, b.lon, b.lat);
        return da - db;
    });
}
function render() {
    elLocAction.style.display = state.currentPos ? 'block' : 'none';
    if (!state.addresses.length) { elListBox.innerHTML = ''; elEmptyBox.style.display = 'block'; return; }
    elEmptyBox.style.display = 'none';
    elListBox.innerHTML = `<div class="list-title">已添加地址（点击跳转导航 · ✏️可改名）</div>` + sortedAddresses().map(a => {
        const dist = state.currentPos ? `<span class="addr-dist">· ${formatDist(calcDistance(state.currentPos.lng, state.currentPos.lat, a.lon, a.lat))}</span>` : '';
        const remarkHtml = a.remark
            ? `<div class="addr-remark">${escapeHtml(a.remark)}</div>`
            : `<div class="addr-remark empty">点击 ✏️ 添加备注</div>`;
        return `<div class="addr-card" data-id="${a.id}">
            <div class="addr-icon">${a._fromCurrent ? '🧭' : '📍'}</div>
            <div class="addr-info">
                <div class="addr-name">${escapeHtml(a.name)}</div>
                <div class="addr-coord">${a.lat.toFixed(4)}, ${a.lon.toFixed(4)}${dist}</div>
                ${remarkHtml}
            </div>
            <div class="addr-edit" data-edit="${a.id}" title="编辑名称/备注">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            </div>
            <div class="addr-delete" data-del="${a.id}">×</div>
        </div>`;
    }).join('');
}

elKeyword.addEventListener('input', onInput);
elKeyword.addEventListener('focus', () => { if (elKeyword.value.trim()) doSearch(elKeyword.value.trim()); });
elKeyword.addEventListener('blur', () => setTimeout(() => elSuggestBox.innerHTML = '', 200));
elSuggestBox.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.suggestion-item');
    if (item) { e.preventDefault(); pickSuggestion(item); }
});
$('addBtn').addEventListener('click', manualAdd);
$('refreshBtn').addEventListener('click', () => getCurrentLocation(false));
$('locAction').addEventListener('click', addCurrentLocation);
$('editModal').addEventListener('click', (e) => { if (e.target === $('editModal')) closeEdit(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEdit(); });

elListBox.addEventListener('click', (e) => {
    const editBtn = e.target.closest('.addr-edit');
    if (editBtn) { e.stopPropagation(); openEdit(editBtn.dataset.edit); return; }
    const del = e.target.closest('.addr-delete');
    if (del) { e.stopPropagation(); deleteAddr(del.dataset.del); return; }
    const card = e.target.closest('.addr-card');
    if (card) {
        const id = card.dataset.id;
        const addr = state.addresses.find(a => a.id === id);
        jumpToNav(addr);
    }
});


load();
runKeyCheck();
getCurrentLocation(true);
</script>
</body>
</html>
