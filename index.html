<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>导航地址管理</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f2f7; }
    .page { background: #f2f2f7; min-height: 100vh; padding-bottom: 40px; }
    .header { background: #fff; padding: 16px; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #e5e5ea; }
    .title { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 12px; }
    .location-bar { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #666; }
    .location-text { display: flex; align-items: center; gap: 6px; flex: 1; overflow: hidden; }
    .location-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .location-dot.loading { background: #f0ad4e; animation: pulse 1.5s infinite; }
    .location-dot.ok { background: #34c759; }
    .location-dot.fail { background: #ff3b30; }
    @keyframes pulse { 0%{opacity:1} 50%{opacity:0.4} 100%{opacity:1} }
    .location-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh-btn { color: #007aff; font-size: 13px; padding: 4px 8px; flex-shrink: 0; cursor: pointer; }
    .add-section { background: #fff; padding: 12px; display: flex; gap: 8px; align-items: flex-start; position: sticky; top: 73px; z-index: 9; border-bottom: 1px solid #e5e5ea; }
    .input-wrap { flex: 1; position: relative; }
    .address-input { width: 100%; padding: 10px 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box; }
    .address-input:focus { border-color: #007aff; }
    .suggestions { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); max-height: 320px; overflow-y: auto; z-index: 20; }
    .suggestion-item { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #f2f2f7; }
    .suggestion-name { font-size: 15px; color: #1c1c1e; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .suggestion-dist { font-size: 12px; color: #34c759; flex-shrink: 0; font-weight: 500; }
    .suggestion-address { font-size: 12px; color: #999; margin-top: 2px; }
    .btn-add { background: #007aff; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; }
    .loc-action { background: #e8f0fe; color: #007aff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 0 12px 10px; text-align: left; width: calc(100% - 24px); cursor: pointer; }
    .list { padding: 12px; }
    .list-title { font-size: 14px; color: #666; margin-bottom: 8px; }
    .addr-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); cursor: pointer; }
    .addr-icon { width: 40px; height: 40px; border-radius: 8px; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .addr-info { flex: 1; overflow: hidden; }
    .addr-name { font-size: 16px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr-remark { font-size: 12px; color: #999; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .addr-coord { font-size: 12px; color: #999; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
    .addr-dist { color: #34c759; font-weight: 500; }
    .addr-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .addr-edit { color: #8e8e93; font-size: 18px; padding: 4px 8px; cursor: pointer; line-height: 1; }
    .addr-delete { color: #ff3b30; font-size: 20px; padding: 4px 8px; cursor: pointer; line-height: 1; }
    .empty { text-align: center; color: #999; padding: 60px 20px; }
    .footer-tip { text-align: center; font-size: 12px; color: #999; margin-top: 20px; padding: 0 20px; }
    .key-tip { margin: 12px; padding: 12px 14px; background: #fff4e5; border: 1px solid #ffd591; border-radius: 10px; font-size: 13px; color: #8a6d3b; line-height: 1.7; }
    .toast { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.75); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 100; white-space: nowrap; }
    .diag { margin: 12px; padding: 10px 12px; background: #eef; border: 1px solid #ccd; border-radius: 10px; font-size: 12px; color: #335; white-space: pre-wrap; }

    /* 编辑弹窗样式 */
    .modal-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: #fff; border-radius: 14px; width: 100%; max-width: 400px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 20px; }
    .modal-input-group { margin-bottom: 16px; }
    .modal-label { font-size: 14px; color: #666; margin-bottom: 6px; display: block; }
    .modal-input { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 15px; outline: none; box-sizing: border-box; }
    .modal-input:focus { border-color: #007aff; }
    .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
    .modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 500; cursor: pointer; border: none; }
    .modal-btn-cancel { background: #f2f2f7; color: #333; }
    .modal-btn-save { background: #007aff; color: #fff; }
</style>
</head>
<body>
<div class="page">
    <div class="header">
        <div class="title">导航地址管理</div>
        <div class="location-bar">
            <div class="location-text">
                <div class="location-dot" id="locDot"></div>
                <span class="location-label" id="locText">正在定位…</span>
            </div>
            <span class="refresh-btn" id="refreshBtn">刷新</span>
        </div>
    </div>

    <div class="add-section">
        <div class="input-wrap">
            <input class="address-input" id="keyword" placeholder="输入地名/店名，如：超市、学校" autocomplete="off">
            <div class="suggestions" id="suggestBox"></div>
        </div>
        <button class="btn-add" id="addBtn">添加</button>
    </div>

    <button class="loc-action" id="locAction" style="display:none">➕ 将「当前位置」加入导航列表</button>

    <div class="list" id="listBox"></div>
    <div class="empty" id="emptyBox">暂无地址，添加后点击即可导航</div>

    <div class="footer-tip">点击地址卡片可直接跳转高德地图导航 🗺️</div>
    <div class="key-tip" id="keyTip"></div>
    <div class="diag" id="diagBox"></div>

    <!-- 编辑弹窗 -->
    <div class="modal-mask" id="editModal" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">编辑地址</div>
            <div class="modal-input-group">
                <label class="modal-label">地址名称 *</label>
                <input class="modal-input" id="editName" placeholder="请输入地址名称，如：接娃奶茶">
            </div>
            <div class="modal-input-group">
                <label class="modal-label">备注（可选）</label>
                <input class="modal-input" id="editRemark" placeholder="如：B1层停车场、走西门最近">
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" id="editCancel">取消</button>
                <button class="modal-btn modal-btn-save" id="editSave">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 配置：填「Web 服务」Key（搜索/逆地理需要）；导航本身不收费
// ============================================================
const AMAP_WEB_KEY = 'aafb549191e1ababd28f5327c82fc911';

// ============================================================
// 🔧 核心：WGS84（浏览器原始坐标）→ GCJ02（高德专用坐标）转换算法
// 解决定位偏移几百米的根本问题
// ============================================================
const a = 6378245.0; // 长半轴
const ee = 0.00669342162296594323; // 扁率
const pi = Math.PI;
const x_pi = pi * 3000.0 / 180.0;

function transformLat(x, y) {
    let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(y * pi) + 40.0 * Math.sin(y / 3.0 * pi)) * 2.0 / 3.0;
    ret += (160.0 * Math.sin(y / 12.0 * pi) + 320 * Math.sin(y * pi / 30.0)) * 2.0 / 3.0;
    return ret;
}

function transformLon(x, y) {
    let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    ret += (20.0 * Math.sin(6.0 * x * pi) + 20.0 * Math.sin(2.0 * x * pi)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(x * pi) + 40.0 * Math.sin(x / 3.0 * pi)) * 2.0 / 3.0;
    ret += (150.0 * Math.sin(x / 12.0 * pi) + 300.0 * Math.sin(x / 30.0 * pi)) * 2.0 / 3.0;
    return ret;
}

// 判断是否在国内（只有国内坐标需要转换）
function outOfChina(lat, lon) {
    return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271;
}

// WGS84转GCJ02（浏览器坐标→高德坐标）
function wgs84ToGcj02(lon, lat) {
    if (outOfChina(lat, lon)) return { lon, lat };
    let dLat = transformLat(lon - 105.0, lat - 35.0);
    let dLon = transformLon(lon - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * pi;
    let magic = Math.sin(radLat);
    magic = 1 - ee * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * pi);
    dLon = (dLon * 180.0) / (a / sqrtMagic * Math.cos(radLat) * pi);
    return {
        lon: lon + dLon,
        lat: lat + dLat
    };
}

// ============================================================
// 工具：唯一 id + 坐标校验 + 精度格式化
// ============================================================
let _idSeed = 1;
function genId() { return Date.now().toString(36) + '_' + (_idSeed++).toString(36); }

function isValidCoord(lon, lat) {
    const lo = parseFloat(lon);
    const la = parseFloat(lat);
    return !isNaN(lo) && !isNaN(la) && lo >= -180 && lo <= 180 && la >= -90 && la <= 90;
}

function formatAccuracy(accuracy) {
    if (!accuracy || isNaN(accuracy)) return '';
    return accuracy < 1000 ? `±${Math.round(accuracy)}米` : `±${(accuracy/1000).toFixed(1)}公里`;
}

function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1800);
}

// ============================================================
// 状态
// ============================================================
const state = {
    keyword: '',
    addresses: [],       // {id, name, remark, lon, lat, _isCurrent}
    currentPos: null,     // 转换后的GCJ02坐标 {lng, lat}
    rawPos: null,         // 浏览器原始WGS84坐标 {lng, lat, accuracy}
    currentAddr: '',
    currentCity: '',
    currentDistrict: '',
    suggestions: [],
    timer: null,
    editingId: null       // 当前正在编辑的地址id
};

const $ = (id) => document.getElementById(id);
const elLocDot = $('locDot');
const elLocText = $('locText');
const elKeyword = $('keyword');
const elSuggestBox = $('suggestBox');
const elListBox = $('listBox');
const elEmptyBox = $('emptyBox');
const elLocAction = $('locAction');
const elKeyTip = $('keyTip');
const elDiag = $('diagBox');
const elEditModal = $('editModal');
const elEditName = $('editName');
const elEditRemark = $('editRemark');

function setLoc(state_, text) {
    elLocDot.className = 'location-dot ' + state_;
    elLocText.textContent = text;
}

// ============================================================
// 本地存储（带 id/remark 兼容）
// ============================================================
function load() {
    try {
        const saved = localStorage.getItem('navAddresses');
        if (saved) {
            state.addresses = JSON.parse(saved).map(a => { 
                if (!a.id) a.id = genId();
                if (a.remark === undefined) a.remark = '';
                return a;
            });
        }
    } catch (e) {}
    render();
}
function save() {
    localStorage.setItem('navAddresses', JSON.stringify(state.addresses));
}

// ============================================================
// Key 自检
// ============================================================
function runKeyCheck() {
    if (!AMAP_WEB_KEY) {
        elKeyTip.textContent = '⚠️ 搜索不可用：请填 AMAP_WEB_KEY（Web 服务 Key）。定位与导航不受影响。';
        return;
    }
    fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=116.397428,39.90923&extensions=base`)
        .then(r => r.json()).then(d => {
            if (d.status === '1') elKeyTip.textContent = '';
            else if (d.infocode === '10001') elKeyTip.textContent = '⚠️ Key 无效/过期';
            else if (d.infocode === '10020' || d.info === 'USERKEY_PLAT_NOMATCH') elKeyTip.textContent = '⚠️ Key 类型不匹配：必须是「Web 服务」Key';
            else elKeyTip.textContent = `⚠️ ${d.info}（${d.infocode}）`;
        }).catch(() => {});
}

// ============================================================
// 🔧 优化定位：高精度参数 + 精度过滤 + 坐标转换
// ============================================================
function getCurrentLocation(silent) {
    setLoc('loading', silent ? '正在定位…' : '重新定位中…');
    
    // 优先使用浏览器高精度定位
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const rawLng = pos.coords.longitude;
                const rawLat = pos.coords.latitude;
                const accuracy = pos.coords.accuracy; // 精度半径（米）
                
                // 🔴 精度过滤：只接受误差≤100米的结果
                if (accuracy > 100) {
                    setLoc('fail', `定位精度不足（${formatAccuracy(accuracy)}），请到开阔地带重试`);
                    toast(`当前定位误差较大，建议刷新重试`);
                    return;
                }
                
                // 保存原始坐标和精度
                state.rawPos = { lng: rawLng, lat: rawLat, accuracy };
                // 转换为高德专用GCJ02坐标
                const gcjPos = wgs84ToGcj02(rawLng, rawLat);
                state.currentPos = { lng: gcjPos.lon, lat: gcjPos.lat };
                
                setLoc('ok', `当前位置：${formatAccuracy(accuracy)}`);
                reverseGeocode(gcjPos.lat, gcjPos.lon, accuracy);
                render();
            },
            (err) => {
                console.warn('HTML5 高精度定位失败，尝试IP定位', err);
                let errMsg = '定位失败';
                if (err.code === 1) errMsg = '请允许浏览器获取定位权限';
                if (err.code === 2) errMsg = '无法获取位置，请检查网络';
                if (err.code === 3) errMsg = '定位超时，请刷新重试';
                setLoc('fail', errMsg);
                ipLocate(); // 降级到IP定位
            },
            // 🔴 优化定位参数
            { 
                enableHighAccuracy: true, // 强制开启GPS高精度
                timeout: 15000,           // 超时时间15秒
                maximumAge: 0             // 不使用缓存的旧位置
            }
        );
    } else {
        ipLocate(); // 浏览器不支持定位，直接用IP定位
    }
}

// IP定位（降级方案，精度较低）
function ipLocate() {
    if (!AMAP_WEB_KEY) { setLoc('fail', '定位失败，可点击刷新重试'); return; }
    fetch(`https://restapi.amap.com/v3/ip?key=${AMAP_WEB_KEY}`)
        .then(r => r.json()).then(d => {
            if (d.status === '1' && d.rectangle) {
                const c = d.rectangle.split(';')[0].split(',');
                const lng = parseFloat(c[0]), lat = parseFloat(c[1]);
                if (isValidCoord(lng, lat)) {
                    state.currentPos = { lng, lat };
                    state.rawPos = { lng, lat, accuracy: 1000 }; // IP定位精度默认1公里
                    setLoc('ok', `当前位置：${d.city || '已获取'}（IP定位，精度较低）`);
                    reverseGeocode(lat, lng, 1000);
                    render();
                    return;
                }
            }
            setLoc('fail', '定位失败，可点击刷新重试');
        }).catch(() => setLoc('fail', '定位失败，可点击刷新重试'));
}

// 逆地理编码（获取街道地址）
function reverseGeocode(lat, lng, accuracy) {
    if (!AMAP_WEB_KEY) return;
    fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=${lng},${lat}&radius=1000&extensions=base`)
        .then(r => r.json()).then(d => {
            if (d.status === '1' && d.regeocode) {
                const c = d.regeocode.addressComponent || {};
                const parts = [c.city || c.district || c.province, c.district, c.township].filter(Boolean);
                state.currentCity = c.city || c.district || '';
                state.currentDistrict = c.district || '';
                state.currentAddr = parts.join('·') || d.regeocode.formatted_address || state.currentCity;
                // 显示地址+精度
                const accText = formatAccuracy(accuracy);
                setLoc('ok', `当前位置：${state.currentAddr}（${accText}）`);
                render();
            }
        }).catch(() => {});
}

// ============================================================
// 搜索下拉
// ============================================================
function onInput() {
    const kw = elKeyword.value.trim();
    state.keyword = kw;
    if (!kw) { elSuggestBox.innerHTML = ''; return; }
    clearTimeout(state.timer);
    state.timer = setTimeout(() => doSearch(kw), 350);
}
function doSearch(keyword) {
    if (!AMAP_WEB_KEY) { renderSuggest([]); return; }
    const center = state.currentPos ? `${state.currentPos.lng},${state.currentPos.lat}` : '';
    const city = state.currentDistrict ? encodeURIComponent(state.currentDistrict)
        : (state.currentCity ? encodeURIComponent(state.currentCity) : '全国');
    let url = `https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=${city}&citylimit=false&offset=25`;
    if (center) url += `&location=${center}&radius=50000`;
    fetch(url).then(r => r.json()).then(d => {
        let pois = (d.status === '1' && d.pois) ? d.pois : [];
        if (!pois.length && center) {
            return fetch(`https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=全国&offset=25`)
                .then(r => r.json()).then(d2 => renderSuggest((d2.status === '1' && d2.pois) ? d2.pois : []));
        }
        renderSuggest(pois);
    }).catch(() => renderSuggest([]));
}
function renderSuggest(pois) {
    state.suggestions = pois.map(p => {
        const loc = p.location ? p.location.split(',') : [null, null];
        const lon = parseFloat(loc[0]), lat = parseFloat(loc[1]);
        const dist = (isValidCoord(lon, lat) && state.currentPos) ? calcDistance(state.currentPos.lng, state.currentPos.lat, lon, lat) : null;
        return Object.assign({}, p, { lon, lat, _dist: dist });
    }).sort((a, b) => (a._dist == null ? 1e15 : a._dist) - (b._dist == null ? 1e15 : b._dist));
    elSuggestBox.innerHTML = state.suggestions.slice(0, 15).map(p => {
        const dist = (p._dist != null) ? `<span class="suggestion-dist">${formatDist(p._dist)}</span>` : '';
        return `<div class="suggestion-item" data-name="${escapeAttr(p.name)}" data-lon="${p.lon}" data-lat="${p.lat}">
            <div class="suggestion-name">${highlight(p.name)}${dist}</div>
            <div class="suggestion-address">${p.adname || p.address || ''}</div>
        </div>`;
    }).join('');
}
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function highlight(name) {
    const kw = state.keyword.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    if (!kw) return escapeHtml(name);
    return escapeHtml(name).replace(new RegExp(kw, 'gi'), m => `<span style="color:#007aff;font-weight:600">${m}</span>`);
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function formatDist(m) { if (m == null || isNaN(m)) return ''; return m < 1000 ? Math.round(m) + 'm' : (m / 1000).toFixed(1) + 'km'; }
function calcDistance(lng1, lat1, lng2, lat2) {
    const R = 6371000, toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

// ============================================================
// 添加 / 删除（带精度校验）
// ============================================================
function pickSuggestion(el) {
    const p = { name: el.dataset.name, lon: el.dataset.lon, lat: el.dataset.lat };
    if (!p.name || !isValidCoord(p.lon, p.lat)) { toast('该地点缺少坐标，请换一个'); elSuggestBox.innerHTML = ''; return; }
    state.addresses.push({ id: genId(), name: p.name, remark: '', lon: parseFloat(p.lon), lat: parseFloat(p.lat) });
    save(); elKeyword.value = ''; elSuggestBox.innerHTML = ''; toast('已添加'); render();
}

// 🔧 添加当前位置：只有高精度定位才允许添加
function addCurrentLocation() {
    if (!state.currentPos) { toast('暂未获取到当前位置'); return; }
    if (!isValidCoord(state.currentPos.lng, state.currentPos.lat)) { toast('当前定位坐标无效'); return; }
    // 检查定位精度，低精度不允许添加
    if (state.rawPos && state.rawPos.accuracy > 100) {
        toast(`当前定位精度不足（${formatAccuracy(state.rawPos.accuracy)}），请刷新后重试`);
        return;
    }
    if (state.addresses.find(a => a._isCurrent)) { toast('当前位置已在列表中'); return; }
    const name = state.currentAddr ? `📍 当前位置（${state.currentAddr}）` : '📍 当前位置';
    // 存的是转换后的高德GCJ02坐标，避免偏移
    state.addresses.unshift({ 
        id: genId(), 
        name, 
        remark: `精度${formatAccuracy(state.rawPos?.accuracy)}`, 
        lon: state.currentPos.lng, 
        lat: state.currentPos.lat, 
        _isCurrent: true 
    });
    save(); toast('已添加当前位置（高精度）'); render();
}

function manualAdd() {
    const name = elKeyword.value.trim();
    if (!name) { toast('请输入地名'); return; }
    if (state.currentPos) {
        if (!isValidCoord(state.currentPos.lng, state.currentPos.lat)) { toast('当前定位坐标无效'); return; }
        state.addresses.push({ id: genId(), name, remark: '', lon: state.currentPos.lng, lat: state.currentPos.lat });
        save(); elKeyword.value = ''; toast('已添加（坐标为当前位置）'); render();
    } else {
        const coord = prompt('未定位，请输入经纬度（经度,纬度，如 109.73,38.28）');
        if (!coord) return;
        const parts = coord.split(',').map(Number);
        if (parts.length !== 2 || !isValidCoord(parts[0], parts[1])) { toast('格式错误或坐标超范围'); return; }
        state.addresses.push({ id: genId(), name, remark: '', lon: parts[0], lat: parts[1] });
        save(); elKeyword.value = ''; render();
    }
}

function deleteAddr(id) {
    if (id == null) return;
    const idx = state.addresses.findIndex(a => a.id === id);
    if (idx > -1) { state.addresses.splice(idx, 1); save(); render(); }
}
