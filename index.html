<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>导航地址管理</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        background-color: #f5f6f8; color: #333; line-height: 1.6; font-size: 14px;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 90px; }

    header { text-align: center; margin-bottom: 15px; }
    h1 { font-size: 18px; font-weight: 600; }

    .status-bar {
        display: flex; justify-content: space-between; align-items: center;
        background: #fff; padding: 12px 15px; border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 12px;
    }
    .current-loc-text { font-size: 13px; color: #666; display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; flex-shrink: 0; }
    .dot.loading { background: #f0ad4e; animation: pulse 1.5s infinite; }
    .dot.ok { background: #52c41a; }
    .dot.fail { background: #ff4d4f; }
    @keyframes pulse { 0%{opacity:1} 50%{opacity:0.4} 100%{opacity:1} }
    .loc-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .refresh-btn { color: #1890ff; font-size: 13px; cursor: pointer; flex-shrink: 0; padding: 4px 6px; }

    .search-row { display: flex; gap: 10px; margin-bottom: 12px; position: relative; }
    #keyword {
        flex: 1; height: 44px; border: 1px solid #e0e0e0; border-radius: 22px;
        padding: 0 16px; font-size: 14px; outline: none; transition: border .2s; -webkit-appearance: none;
    }
    #keyword:focus { border-color: #1890ff; }
    #addBtn { width: 76px; height: 44px; background: #1890ff; color: #fff; border: none; border-radius: 22px; font-size: 14px; cursor: pointer; flex-shrink: 0; }

    .suggestions {
        position: absolute; top: calc(100% + 6px); left: 0; right: 0;
        background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.15);
        max-height: 320px; overflow-y: auto; z-index: 30;
    }
    .suggestion-item { padding: 11px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:active { background: #f5f5f5; }
    .sug-name { font-size: 15px; color: #262626; display: flex; justify-content: space-between; gap: 8px; }
    .sug-dist { font-size: 12px; color: #389e0d; font-weight: 500; flex-shrink: 0; }
    .sug-addr { font-size: 12px; color: #999; margin-top: 2px; }

    .loc-action {
        background: #e6f7ff; color: #1890ff; border: 1px solid #bae7ff;
        padding: 11px 14px; border-radius: 12px; font-size: 13px;
        width: 100%; text-align: left; cursor: pointer; margin-bottom: 14px;
    }

    .tip-box {
        background: #fffbe6; color: #faad14; padding: 10px 14px; border-radius: 8px;
        font-size: 12px; margin-bottom: 14px; display: none; align-items: center; gap: 8px; border: 1px solid #ffe58f;
    }
    .tip-box.show { display: flex; }
    .tip-box.error { background: #fff2f0; color: #ff4d4f; border-color: #ffccc7; }

    .list-title { font-size: 13px; color: #999; margin-bottom: 8px; padding-left: 5px; }

    .addr-card {
        background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04); position: relative; overflow: hidden;
        border: 1px solid #f0f0f0; transition: transform .15s; cursor: pointer;
    }
    .addr-card:active { transform: scale(.995); }
    .card-top { display: flex; align-items: center; gap: 10px; }
    .addr-icon {
        width: 36px; height: 36px; background: #e6f7ff; border: 1px solid #d0ebff;
        border-radius: 9px; display: flex; align-items: center; justify-content: center;
        font-size: 17px; flex-shrink: 0;
    }
    .addr-card[data-current="true"] .addr-icon { background: #fff2f0; border-color: #ffccc7; }
    .addr-info { flex: 1; min-width: 0; }
    .addr-name { font-size: 15px; font-weight: 600; color: #262626; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .addr-desc { font-size: 11px; color: #8c8c8c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; line-height: 1.3; }
    .addr-meta { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .addr-dist { font-size: 11px; color: #389e0d; font-weight: 500; }
    .addr-note {
        background: #fafafa; border-radius: 6px; padding: 5px 9px; margin-top: 6px;
        font-size: 12px; color: #595959; display: flex; align-items: center; gap: 5px; border: 1px dashed #e8e8e8; line-height: 1.3;
    }
    .addr-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 8px; }
    .action-btn { font-size: 15px; cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
    .action-btn:active { background: #f0f0f0; }
    .action-del { color: #ff4d4f; }

    .empty-box { text-align: center; padding: 50px 20px; color: #bfbfbf; display: none; background: #fff; border-radius: 12px; margin-top: 10px; }
    .empty-box.show { display: block; }
    .empty-icon { font-size: 46px; margin-bottom: 10px; opacity: .5; }

    footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 10px; background: rgba(255,255,255,.95); font-size: 12px; color: #999; box-shadow: 0 -2px 10px rgba(0,0,0,.05); max-width: 600px; margin: 0 auto; }

    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-mask.show { display: flex; }
    .modal-box { background: #fff; width: 100%; max-width: 400px; border-radius: 14px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
    .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 18px; }
    .modal-group { margin-bottom: 14px; }
    .modal-label { font-size: 13px; color: #666; margin-bottom: 6px; display: block; }
    .modal-input { width: 100%; padding: 11px 12px; border: 1px solid #d9d9d9; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box; }
    .modal-input:focus { border-color: #1890ff; }
    .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; }
    .modal-btn-cancel { background: #f5f5f5; color: #333; }
    .modal-btn-save { background: #1890ff; color: #fff; }
</style>
</head>
<body>

<div class="container">
    <header><h1>导航地址管理</h1></header>

    <div class="status-bar">
        <div class="current-loc-text">
            <span class="dot" id="locDot"></span>
            <span class="loc-label" id="locText">正在定位…</span>
        </div>
        <span class="refresh-btn" id="refreshBtn">刷新</span>
    </div>

    <div class="search-row">
        <input type="text" id="keyword" placeholder="输入地名/店名，如：超市、学校" autocomplete="off">
        <div class="suggestions" id="suggestBox"></div>
        <button id="addBtn">添加</button>
    </div>

    <button class="loc-action" id="locAction" style="display:none">➕ 记录「当前位置」（可多次添加，搜不到地址时用它）</button>

    <div class="tip-box" id="tipBox"><span>💡</span><span id="tipText"></span></div>

    <div class="list-title" id="listTitle" style="display:none;">已添加地址（点击跳转导航 · ✏️可编辑）</div>
    <div id="listBox"></div>
    <div class="empty-box" id="emptyBox">
        <div class="empty-icon">📋</div>
        <div>还没有添加任何地址</div>
        <div style="font-size:12px;margin-top:5px;">搜不到具体地址时，点上方按钮记录当前位置</div>
    </div>
</div>

<footer>点击地址卡片可直接跳转高德地图导航 🗺️</footer>

<div class="modal-mask" id="editModal">
    <div class="modal-box">
        <div class="modal-title">编辑地址</div>
        <div class="modal-group">
            <label class="modal-label">地址名称 *</label>
            <input class="modal-input" id="editName" placeholder="如：客户A楼下、工地入口">
        </div>
        <div class="modal-group">
            <label class="modal-label">备注（可选）</label>
            <input class="modal-input" id="editRemark" placeholder="如：B1层停车场、走西门最近">
        </div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="editCancel">取消</button>
            <button class="modal-btn modal-btn-save" id="editSave">保存</button>
        </div>
    </div>
</div>

<script>
const AMAP_WEB_KEY = 'aafb549191e1ababd28f5327c82fc911';

// WGS84 → GCJ02（浏览器定位坐标是 WGS84，高德用 GCJ02，不转换会偏移 300~700 米）
const A = 6378245.0, EE = 0.00669342162296594323, PI = Math.PI;
function transformLat(x, y) {
    let ret = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    ret += (20.0*Math.sin(6.0*x*PI) + 20.0*Math.sin(2.0*x*PI))*2.0/3.0;
    ret += (20.0*Math.sin(y*PI) + 40.0*Math.sin(y/3.0*PI))*2.0/3.0;
    ret += (160.0*Math.sin(y/12.0*PI) + 320*Math.sin(y*PI/30.0))*2.0/3.0;
    return ret;
}
function transformLon(x, y) {
    let ret = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    ret += (20.0*Math.sin(6.0*x*PI) + 20.0*Math.sin(2.0*x*PI))*2.0/3.0;
    ret += (20.0*Math.sin(x*PI) + 40.0*Math.sin(x/3.0*PI))*2.0/3.0;
    ret += (150.0*Math.sin(x/12.0*PI) + 300.0*Math.sin(x/30.0*PI))*2.0/3.0;
    return ret;
}
function outOfChina(lat, lon) { return lon < 72.004 || lon > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function wgs84ToGcj02(lon, lat) {
    if (outOfChina(lat, lon)) return { lon, lat };
    let dLat = transformLat(lon-105.0, lat-35.0), dLon = transformLon(lon-105.0, lat-35.0);
    const radLat = lat/180.0*PI, magic = 1 - EE*Math.sin(radLat)*Math.sin(radLat);
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat*180.0) / ((A*(1-EE))/(magic*sqrtMagic)*PI);
    dLon = (dLon*180.0) / (A/sqrtMagic*Math.cos(radLat)*PI);
    return { lon: lon+dLon, lat: lat+dLat };
}

let _idSeed = 1;
function genId() { return Date.now().toString(36) + '_' + (_idSeed++).toString(36); }
function isValidCoord(lon, lat) {
    const lo = parseFloat(lon), la = parseFloat(lat);
    return !isNaN(lo) && !isNaN(la) && lo >= -180 && lo <= 180 && la >= -90 && la <= 90;
}
function escapeHtml(str) { return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }
function formatDist(m) { if (m == null || isNaN(m)) return ''; m = parseFloat(m); return m < 1000 ? Math.round(m)+'m' : (m/1000).toFixed(1)+'km'; }
function formatAccuracy(acc) { if (!acc || isNaN(acc)) return ''; return acc < 1000 ? '±'+Math.round(acc)+'米' : '±'+(acc/1000).toFixed(1)+'公里'; }
function toast(msg, isError) {
    const el = document.getElementById('tipBox'), txt = document.getElementById('tipText');
    txt.textContent = msg;
    el.className = 'tip-box show' + (isError ? ' error' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), isError ? 8000 : 4000);
}

const state = {
    addresses: [],    // {id, name, remark, lon, lat, _fromCurrent, time}
    currentPos: null, // 转换后的 GCJ02
    rawPos: null,     // 原始 WGS84 + accuracy
    currentAddr: '', currentCity: '', currentDistrict: '',
    suggestions: [], timer: null, editingId: null,
};

const $ = id => document.getElementById(id);
const elKeyword = $('keyword'), elSuggestBox = $('suggestBox'), elListBox = $('listBox');
const elEmptyBox = $('emptyBox'), elListTitle = $('listTitle'), elLocAction = $('locAction');
const elTipBox = $('tipBox'), elEditModal = $('editModal');
const elEditName = $('editName'), elEditRemark = $('editRemark');
const elLocDot = $('locDot'), elLocText = $('locText');

function setLoc(cls, text) { elLocDot.className = 'dot ' + cls; elLocText.textContent = text; }

function load() {
    try {
        const saved = localStorage.getItem('navAddresses');
        if (saved) state.addresses = JSON.parse(saved).map(a => { if (!a.id) a.id = genId(); if (a.remark === undefined) a.remark = ''; return a; });
    } catch (e) {}
    render();
}
function save() { localStorage.setItem('navAddresses', JSON.stringify(state.addresses)); }

function runKeyCheck() {
    if (!AMAP_WEB_KEY) return;
    if (location.protocol === 'file:') { toast('建议用 http/https 打开（file:// 下搜索可能失败）', true); return; }
    fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=116.397428,39.90923&extensions=base`)
        .then(r => r.json()).then(d => {
            if (d.status === '1') elTipBox.classList.remove('show');
            else if (d.infocode === '10001') toast('Key 无效/过期', true);
            else if (d.infocode === '10020' || d.info === 'USERKEY_PLAT_NOMATCH') toast('Key 类型不匹配：必须是「Web 服务」Key', true);
            else if (d.infocode === '10003') toast('未启用 Web 服务权限', true);
            else if (d.infocode === '10044') toast('IP 白名单限制', true);
            else toast(`${d.info}（${d.infocode}）`, true);
        }).catch(() => {});
}

function getCurrentLocation(silent) {
    setLoc('loading', silent ? '正在定位…' : '重新定位中…');
    if (!navigator.geolocation) { ipLocate(); return; }
    navigator.geolocation.getCurrentPosition(pos => {
        const { longitude, latitude, accuracy } = pos.coords;
        state.rawPos = { lng: longitude, lat: latitude, accuracy };
        const gcj = wgs84ToGcj02(longitude, latitude);
        state.currentPos = { lng: gcj.lon, lat: gcj.lat };
        setLoc('ok', `当前位置：${formatAccuracy(accuracy)}`);
        reverseGeocode(gcj.lat, gcj.lon, accuracy);
        render();
        if (!silent && accuracy > 100) toast(`定位精度较低（${formatAccuracy(accuracy)}），可刷新重试`, true);
    }, err => {
        let msg = '定位失败';
        if (err.code === 1) msg = '请允许浏览器获取定位权限';
        else if (err.code === 2) msg = '无法获取位置，检查网络';
        else if (err.code === 3) msg = '定位超时，请刷新重试';
        setLoc('fail', msg); toast(msg, true); ipLocate();
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}
function ipLocate() {
    if (!AMAP_WEB_KEY) { setLoc('fail', '定位失败'); return; }
    fetch(`https://restapi.amap.com/v3/ip?key=${AMAP_WEB_KEY}`)
        .then(r => r.json()).then(d => {
            if (d.status === '1' && d.rectangle) {
                const c = d.rectangle.split(';')[0].split(',');
                if (c.length >= 2) {
                    const lng = parseFloat(c[0]), lat = parseFloat(c[1]);
                    if (isValidCoord(lng, lat)) {
                        state.currentPos = { lng, lat };
                        state.rawPos = { lng, lat, accuracy: 1000 };
                        setLoc('ok', `当前位置：${d.city || '已获取'}（IP定位）`);
                        reverseGeocode(lat, lng, 1000); render(); return;
                    }
                }
            }
            setLoc('fail', '定位失败');
        }).catch(() => setLoc('fail', '定位失败'));
}
function reverseGeocode(lat, lng, accuracy) {
    if (!AMAP_WEB_KEY) return;
    fetch(`https://restapi.amap.com/v3/geocode/regeo?key=${AMAP_WEB_KEY}&location=${lng},${lat}&radius=1000&extensions=base`)
        .then(r => r.json()).then(d => {
            if (d.status === '1' && d.regeocode) {
                const c = d.regeocode.addressComponent || {};
                const parts = [c.city||c.province, c.district, c.township].filter(Boolean);
                state.currentCity = c.city || c.district || '';
                state.currentDistrict = c.district || '';
                state.currentAddr = parts.join('·') || d.regeocode.formatted_address || state.currentCity;
                setLoc('ok', `当前位置：${state.currentAddr}（${formatAccuracy(accuracy)}）`);
                render();
            }
        }).catch(() => {});
}

function onInput() {
    const kw = elKeyword.value.trim();
    if (!kw) { elSuggestBox.innerHTML = ''; return; }
    clearTimeout(state.timer);
    state.timer = setTimeout(() => doSearch(kw), 350);
}
function doSearch(keyword) {
    if (!AMAP_WEB_KEY) { renderSuggest([]); return; }
    const center = state.currentPos ? `${state.currentPos.lng},${state.currentPos.lat}` : '';
    const city = state.currentDistrict ? encodeURIComponent(state.currentDistrict) : (state.currentCity ? encodeURIComponent(state.currentCity) : '全国');
    let url = `https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=${city}&citylimit=false&offset=25`;
    if (center) url += `&location=${center}&radius=50000`;
    fetch(url).then(r => r.json()).then(d => {
        let pois = (d.status === '1' && d.pois) ? d.pois : [];
        if (!pois.length && center) {
            return fetch(`https://restapi.amap.com/v3/place/text?key=${AMAP_WEB_KEY}&keywords=${encodeURIComponent(keyword)}&city=全国&offset=25`)
                .then(r => r.json()).then(d2 => renderSuggest((d2.status === '1' && d2.pois) ? d2.pois : []));
        }
        renderSuggest(pois);
    }).catch(() => renderSuggest([]));
}
function renderSuggest(pois) {
    state.suggestions = pois.map(p => {
        const loc = p.location ? p.location.split(',') : [null, null];
        const lon = parseFloat(loc[0]), lat = parseFloat(loc[1]);
        const _dist = (isValidCoord(lon, lat) && state.currentPos) ? calcDistance(state.currentPos.lng, state.currentPos.lat, lon, lat) : null;
        return Object.assign({}, p, { lon, lat, _dist });
    }).sort((a, b) => (a._dist == null ? 1e15 : a._dist) - (b._dist == null ? 1e15 : b._dist));
    elSuggestBox.innerHTML = state.suggestions.slice(0, 15).map(p => {
        const dist = (p._dist != null) ? `<span class="sug-dist">${formatDist(p._dist)}</span>` : '';
        return `<div class="suggestion-item" data-name="${escapeAttr(p.name)}" data-lon="${p.lon}" data-lat="${p.lat}">
            <div class="sug-name">${escapeHtml(p.name)}${dist}</div>
            <div class="sug-addr">${escapeHtml(p.adname || p.address || '')}</div>
        </div>`;
    }).join('');
}
function calcDistance(lng1, lat1, lng2, lat2) {
    const R = 6371000, toRad = d => d*Math.PI/180;
    const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    const x = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
}

function pickSuggestion(el) {
    const p = { name: el.dataset.name, lon: el.dataset.lon, lat: el.dataset.lat };
    if (!p.name || !isValidCoord(p.lon, p.lat)) { toast('该地点缺少坐标，请换一个', true); elSuggestBox.innerHTML = ''; return; }
    addAddress(p.name, '', false, parseFloat(p.lon), parseFloat(p.lat));
    elKeyword.value = ''; elSuggestBox.innerHTML = '';
}
function addCurrentLocation() {
    if (!state.currentPos || !isValidCoord(state.currentPos.lng, state.currentPos.lat)) { toast('暂未获取到当前位置', true); return; }
    const time = new Date();
    const ts = `${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`;
    const name = state.currentAddr ? `📍 当前位置 ${ts}（${state.currentAddr}）` : `📍 当前位置 ${ts}`;
    addAddress(name, `精度${formatAccuracy(state.rawPos?.accuracy)}`, true, state.currentPos.lng, state.currentPos.lat);
}
function onAddClick() {
    const kw = elKeyword.value.trim();
    if (!kw) {
        // 搜索框为空 → 添加当前位置
        addCurrentLocation();
        return;
    }
    // 搜索框有内容 → 按名称添加（坐标为当前位置，方便快速记点）
    if (!state.currentPos || !isValidCoord(state.currentPos.lng, state.currentPos.lat)) {
        return toast('暂未获取到当前位置，无法添加', true);
    }
    addAddress(kw, '', false, state.currentPos.lng, state.currentPos.lat);
    elKeyword.value = ''; elSuggestBox.innerHTML = '';
}
function addAddress(name, remark, _fromCurrent, lon, lat) {
    state.addresses.push({ id: genId(), name, remark: remark||'', lon: parseFloat(lon), lat: parseFloat(lat), _fromCurrent, time: Date.now() });
    save(); render(); toast(`已添加：${name}`);
}
function deleteAddr(id) {
    const idx = state.addresses.findIndex(a => a.id === id);
    if (idx > -1) { state.addresses.splice(idx, 1); save(); render(); }
}

function openEdit(id) {
    const addr = state.addresses.find(a => a.id === id);
    if (!addr) return;
    state.editingId = id;
    elEditName.value = addr.name || '';
    elEditRemark.value = addr.remark || '';
    elEditModal.classList.add('show');
    elEditName.focus();
}
function closeEdit() { elEditModal.classList.remove('show'); state.editingId = null; }
function saveEdit() {
    const name = elEditName.value.trim();
    if (!name) return toast('名称不能为空', true);
    const addr = state.addresses.find(a => a.id === state.editingId);
    if (!addr) return closeEdit();
    addr.name = name;
    addr.remark = elEditRemark.value.trim();
    save(); render(); closeEdit(); toast('修改成功');
}

// 跳转高德：坐标已转 GCJ02，scheme 带 dev=0；未装 App 时 location.href 切到网页版（同步调用，不会被弹出拦截）
function jumpToNav(a) {
    if (!a) return;
    const lon = parseFloat(a.lon), lat = parseFloat(a.lat);
    if (!isValidCoord(lon, lat)) { toast('该地址坐标无效，请重新添加', true); return; }
    const name = (a.name && String(a.name).trim()) || '目的地';
    const slat = state.currentPos ? state.currentPos.lat : '', slon = state.currentPos ? state.currentPos.lng : '';
    let scheme;
    if (state.currentPos) {
        scheme = `iosamap://path?sourceApplication=navapp&sid=current&slat=${slat}&slon=${slon}&sname=我的位置&dlat=${lat}&dlon=${lon}&dname=${encodeURIComponent(name)}&t=0&dev=0`;
    } else {
        scheme = `iosamap://navi?sourceApplication=navapp&poiname=${encodeURIComponent(name)}&lat=${lat}&lon=${lon}&dev=0&style=2`;
    }
    const web = `https://uri.amap.com/navigation?to=${lon},${lat},${encodeURIComponent(name)}&mode=car&policy=1`;
    // 先尝试唤起高德 App，若短时间内页面未切后台（说明未唤起），则降级到网页版
    window.location.href = scheme;
    const t = Date.now();
    setTimeout(() => { if (Date.now() - t < 2000 && !document.hidden) window.location.href = web; }, 1500);
}

function sortedAddresses() {
    return state.addresses.slice().sort((a, b) => {
        if (a._fromCurrent && !b._fromCurrent) return -1;
        if (!a._fromCurrent && b._fromCurrent) return 1;
        if (!state.currentPos) return (b.time||0) - (a.time||0);
        return calcDistance(state.currentPos.lng, state.currentPos.lat, a.lon, a.lat) - calcDistance(state.currentPos.lng, state.currentPos.lat, b.lon, b.lat);
    });
}

// render 只操作 listBox 内的卡片列表，empty/title 是独立永久节点，避免 innerHTML 覆盖后节点失效
function render() {
    const hasAddr = state.addresses.length > 0;
    elLocAction.style.display = state.currentAddr ? 'block' : 'none';
    elListTitle.style.display = hasAddr ? 'block' : 'none';
    elEmptyBox.style.display = hasAddr ? 'none' : 'block';

    if (!hasAddr) { elListBox.innerHTML = ''; return; }

    elListBox.innerHTML = sortedAddresses().map(a => {
        const dist = (state.currentPos && !a._fromCurrent) ? `<span class="addr-dist">· ${formatDist(calcDistance(state.currentPos.lng, state.currentPos.lat, a.lon, a.lat))}</span>` : '';
        const cur = a._fromCurrent ? '<span class="addr-dist">· 当前位置</span>' : '';
        const noteHtml = a.remark ? `<div class="addr-note"><span>✏️</span>${escapeHtml(a.remark)}</div>` : '';
        return `<div class="addr-card" data-id="${a.id}" ${a._fromCurrent ? 'data-current="true"' : ''}>
            <div class="card-top">
                <div class="addr-icon">${a._fromCurrent ? '🧭' : '📍'}</div>
                <div class="addr-info">
                    <div class="addr-name">${escapeHtml(a.name)}</div>
                    <div class="addr-desc">${a._fromCurrent && state.currentAddr ? state.currentAddr : ''}</div>
                    <div class="addr-meta">${dist}${cur}</div>
                    ${noteHtml}
                </div>
            </div>
            <div class="addr-actions">
                <span class="action-btn action-edit" data-edit="${a.id}" title="编辑">✏️</span>
                <span class="action-btn action-del" data-del="${a.id}" title="删除">×</span>
            </div>
        </div>`;
    }).join('');
}

elKeyword.addEventListener('input', onInput);
elKeyword.addEventListener('focus', () => { if (elKeyword.value.trim()) doSearch(elKeyword.value.trim()); });
elKeyword.addEventListener('blur', () => setTimeout(() => elSuggestBox.innerHTML = '', 200));
elSuggestBox.addEventListener('mousedown', e => {
    const item = e.target.closest('.suggestion-item');
    if (item) { e.preventDefault(); pickSuggestion(item); }
});
$('addBtn').addEventListener('click', onAddClick);
$('refreshBtn').addEventListener('click', () => getCurrentLocation(false));
$('locAction').addEventListener('click', addCurrentLocation);

elListBox.addEventListener('click', e => {
    const editBtn = e.target.closest('.action-edit');
    const delBtn = e.target.closest('.action-del');
    if (editBtn) { e.stopPropagation(); openEdit(editBtn.dataset.edit); return; }
    if (delBtn) { e.stopPropagation(); deleteAddr(delBtn.dataset.del); return; }
    const card = e.target.closest('.addr-card');
    if (card) { const addr = state.addresses.find(a => a.id === card.dataset.id); jumpToNav(addr); }
});

$('editCancel').addEventListener('click', closeEdit);
$('editSave').addEventListener('click', saveEdit);
elEditModal.addEventListener('click', e => { if (e.target === elEditModal) closeEdit(); });
elEditName.addEventListener('keydown', e => { if (e.key === 'Enter') elEditRemark.focus(); });
elEditRemark.addEventListener('keydown', e => { if (e.key === 'Enter') saveEdit(); });

load();
runKeyCheck();
getCurrentLocation(true);
</script>
</body>
</html>
